server.port=8082
spring.application.name=inventory-service
euraka.client.service-url.defaultZone=http://localhost:8761/eureka/

# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3309/inventorydb
spring.datasource.username=inventory
spring.datasource.password=inventory123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Hibernate properties
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate

#DB Migration with Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

#Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/ecommerce

#Actuator
management.endpoints.web.exposure.include=health,info
management.endpoints.health.show-details=always
