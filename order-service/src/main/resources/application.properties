server.port=8081
spring.application.name=order-service
euraka.client.service-url.defaultZone=http://localhost:8761/eureka/

# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3307/orderdb
spring.datasource.username=order
spring.datasource.password=order123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Hibernate properties
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate

#DB Migration with Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

#Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/ecommerce

#Actuator
management.endpoints.web.exposure.include=health,info
management.endpoints.health.show-details=always

#Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=order-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Json deserializer config
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# JMS ActiveMQ
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin
spring.jms.pub-sub-domain=false


# Sampling probability (100% of requests traced)
management.tracing.sampling.probability=1.0

# Zipkin endpoint
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
logging.pattern.level=%5p [%X{spring.application.name:-},%X{traceId:-},%X{spanId:-}] %m%n